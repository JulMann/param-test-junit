plugins {
    id 'java'
}

group = 'com.julmann'
version = '1.0-SNAPSHOT'

repositories {
    mavenCentral()
}

dependencies {
    testImplementation(
            "com.codeborne:selenide:7.18.2",
            "org.junit.jupiter:junit-jupiter:6.1.3")
    testRuntimeOnly "org.junit.platform:junit-platform-launcher"
}

test {
    useJUnitPlatform()
}